<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pale Hours</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0d; color: #9a9aa3; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud { position: fixed; top: 12px; left: 12px; font: 13px/1.5 ui-monospace, monospace; white-space: pre; pointer-events: none; }
      #lobby { position: fixed; top: 12px; right: 12px; font: 13px ui-monospace, monospace; display: flex; gap: 6px; align-items: center; }
      #lobby label { display: flex; gap: 6px; align-items: center; }
      #lobby #volume { width: 110px; padding: 0; border: 0; background: none; margin: 0; accent-color: #9a9aa3; }
      #room { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 340px; padding: 22px 26px; background: rgba(8, 8, 10, 0.88); border: 1px solid #2a2a33; font: 13px/1.6 ui-monospace, monospace; color: #9a9aa3; display: flex; flex-direction: column; gap: 12px; }
      #room h1 { margin: 0; font-size: 26px; font-weight: normal; letter-spacing: 0.12em; color: #d8d4c8; }
      #room input, #room button { font: inherit; background: #16161a; color: #d8d4c8; border: 1px solid #2a2a33; padding: 5px 10px; }
      #room button:disabled { opacity: 0.4; }
      #room button.chosen { border-color: #c0392b; color: #fff; }
      #room input { width: 5em; text-transform: uppercase; }
      #room .row { display: flex; gap: 8px; align-items: center; }
      #room-code-text { font-size: 26px; letter-spacing: 0.3em; color: #d8d4c8; cursor: pointer; user-select: all; }
      #room-seats { white-space: pre; color: #d8d4c8; }
      #room[hidden], #room [hidden] { display: none; }
      #check { position: fixed; left: 50%; top: 62%; width: 320px; margin-left: -160px; height: 16px; background: #16161a; border: 1px solid #2a2a33; display: none; }
      #check-zone { position: absolute; top: 0; bottom: 0; background: #d8d4c8; }
      #check-needle { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1px; background: #c0392b; }
      #check-result { position: fixed; left: 50%; top: 62%; transform: translate(-50%, 24px); font: 13px ui-monospace, monospace; color: #d8d4c8; }
      #health { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: none; gap: 6px; }
      #health .pip { width: 26px; height: 26px; border: 2px solid #d8d4c8; box-sizing: border-box; }
      #health .pip.full { background: #c0392b; border-color: #c0392b; }
      #result { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(5, 5, 7, 0.7); font: 14px/1.6 ui-monospace, monospace; color: #d8d4c8; pointer-events: none; }
      #result-lines { white-space: pre; text-align: center; }
      #result h1 { font-size: 34px; font-weight: normal; letter-spacing: 0.08em; margin: 0 0 8px; }
      #result #rematch { pointer-events: auto; font: inherit; background: #16161a; color: #d8d4c8; border: 1px solid #2a2a33; padding: 6px 14px; margin-top: 10px; }
      #flash { position: fixed; inset: 0; background: #8a0d0d; opacity: 0; pointer-events: none; transition: opacity 0.6s ease-out; }
      #flash.on { opacity: 0.45; transition: none; }
      #netstatus { position: fixed; bottom: 12px; left: 12px; font: 13px/1.5 ui-monospace, monospace; white-space: pre; }
    </style>
    <script src="/wasm_exec.js"></script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">loading sim…</div>
    <div id="lobby">
      <label>Vol <input id="volume" type="range" min="0" max="100" step="5" /></label>
    </div>
    <div id="room">
      <h1>PALE HOURS</h1>
      <div class="row" id="room-entry">
        <button id="host">Create room</button>
        <span>or</span>
        <input id="code" placeholder="CODE" maxlength="4" />
        <button id="join">Join</button>
      </div>
      <div id="room-code" class="row" hidden>
        <span id="room-code-label"></span>
        <strong id="room-code-text" title="Click to copy"></strong>
        <button id="copy-code" type="button">Copy</button>
      </div>
      <div id="room-seats" hidden></div>
      <div class="row" id="room-picks" hidden>
        <button id="pick-killer">Play killer</button>
        <button id="pick-survivor">Play survivor</button>
      </div>
      <button id="start" hidden>Start</button>
      <div id="room-status"></div>
    </div>
    <div id="check"><div id="check-zone"></div><div id="check-needle"></div></div>
    <div id="check-result"></div>
    <div id="health"><div class="pip"></div><div class="pip"></div></div>
    <div id="flash"></div>
    <div id="result"><h1 id="result-headline"></h1><div id="result-lines"></div><button id="rematch">Rematch</button></div>
    <div id="netstatus">offline</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
